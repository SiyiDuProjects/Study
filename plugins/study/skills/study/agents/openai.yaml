interface:
  display_name: "Study"
  short_description: "Analyze Hanyang coursework with Canvas and lecture evidence"
  default_prompt: "Use $study to review my Hanyang coursework with relevant lecture context."

dependencies:
  tools:
    - type: "mcp"
      value: "canvas"
      description: "Hanyang facts and lecture evidence; shared Canvas uploads, submissions and messages on explicit request"
      transport: "streamable_http"
      url: "https://study.siyidu.com/mcp"

policy:
  allow_implicit_invocation: true
