interface:
  display_name: "Hanyang Canvas"
  short_description: "Review Hanyang coursework, Inbox, LearningX, feedback, and grades"
  brand_color: "#1F6B45"
  default_prompt: "Use $canvas to review my Hanyang coursework and submission status."

dependencies:
  tools:
    - type: "mcp"
      value: "canvas"
      description: "Read-only Hanyang Canvas and gated LearningX tools for the authenticated user's account"
      transport: "streamable_http"
      url: "https://study.siyidu.com/mcp"

policy:
  allow_implicit_invocation: true
