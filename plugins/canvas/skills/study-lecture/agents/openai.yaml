interface:
  display_name: "Study Lecture"
  short_description: "Search and explain Hanyang lecture transcripts with timestamps"
  default_prompt: "Use $study-lecture to find what was said in my recent lectures."

dependencies:
  tools:
    - type: "mcp"
      value: "canvas"
      description: "Read-only Hanyang Canvas and Study Lecture tools"
      transport: "streamable_http"
      url: "https://canvas.gaid.studio/mcp"

policy:
  allow_implicit_invocation: false
