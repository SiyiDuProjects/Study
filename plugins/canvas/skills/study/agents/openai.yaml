interface:
  display_name: "Study"
  short_description: "Analyze Hanyang coursework with Canvas and lecture evidence"
  default_prompt: "Use $study to review my Hanyang coursework with relevant lecture context."

dependencies:
  tools:
    - type: "mcp"
      value: "canvas"
      description: "Read-only Hanyang Canvas and Study Lecture tools"
      transport: "streamable_http"
      url: "https://canvas.gaid.studio/mcp"

policy:
  allow_implicit_invocation: true
