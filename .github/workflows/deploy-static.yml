name: Deploy Study Lecture

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "server/**"
      - "shared/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.mts"
      - "vitest.config.mts"
      - ".github/workflows/deploy-static.yml"
  workflow_dispatch:

concurrency:
  group: deploy-study-lecture
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare release
        run: |
          mkdir -p release
          cp -r dist dist-server package.json package-lock.json release/

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Stage, back up, deploy, and verify locally
        env:
          REMOTE_TMP: /tmp/study-lecture-${{ github.sha }}
        run: |
          [[ "$REMOTE_TMP" =~ ^/tmp/study-lecture-[0-9a-f]{40}$ ]]
          ssh deploy-server "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP'"
          rsync -az --delete release/ deploy-server:"$REMOTE_TMP"/
          ssh deploy-server "bash -se -- '$REMOTE_TMP'" <<'REMOTE'
          set -Eeuo pipefail

          REMOTE_TMP=$1
          readonly APP_PATH=/opt/jiahuan/app
          readonly DATA_PATH=/opt/jiahuan/data
          readonly BACKUP_ROOT=/opt/jiahuan/backups
          readonly COMPOSE_PATH=/home/ubuntu/siyi
          readonly COMPOSE_SERVICE=jiahuan_web
          readonly ENV_PATH=/home/ubuntu/siyi/jiahuan.env
          readonly LOCAL_HEALTH_URL=http://127.0.0.1:8091/api/health

          [[ "$APP_PATH" == "/opt/jiahuan/app" ]]
          [[ "$DATA_PATH" == "/opt/jiahuan/data" ]]
          [[ "$COMPOSE_PATH" == "/home/ubuntu/siyi" ]]
          [[ "$COMPOSE_SERVICE" == "jiahuan_web" ]]
          sudo test -f "$ENV_PATH"
          ! sudo test -L "$ENV_PATH"
          sudo grep -Eq '^[[:space:]]*LECTURE_AUTH_MODE[[:space:]]*=[[:space:]]*public[[:space:]]*$' "$ENV_PATH"
          [[ "$REMOTE_TMP" =~ ^/tmp/study-lecture-[0-9a-f]{40}$ ]]
          [[ -d "$REMOTE_TMP" && ! -L "$REMOTE_TMP" && "$(readlink -f -- "$REMOTE_TMP")" == "$REMOTE_TMP" ]]

          for fixed_path in "$APP_PATH" "$DATA_PATH" "$COMPOSE_PATH"; do
            sudo test -d "$fixed_path"
            ! sudo test -L "$fixed_path"
            [[ "$(sudo readlink -f -- "$fixed_path")" == "$fixed_path" ]]
          done
          sudo test -s "$APP_PATH/package.json"
          sudo test -s "$APP_PATH/dist-server/server/index.js"
          sudo test -f "$DATA_PATH/jiahuan.sqlite"
          ! sudo test -L "$DATA_PATH/jiahuan.sqlite"

          sudo docker run --rm -v "$REMOTE_TMP:/app" -w /app node:22-bookworm-slim npm ci --omit=dev
          cd "$COMPOSE_PATH"
          sudo docker compose config --quiet
          sudo docker compose config --services | grep -Fx "$COMPOSE_SERVICE" >/dev/null

          if sudo test -e "$BACKUP_ROOT" || sudo test -L "$BACKUP_ROOT"; then
            sudo test -d "$BACKUP_ROOT"
            ! sudo test -L "$BACKUP_ROOT"
            [[ "$(sudo readlink -f -- "$BACKUP_ROOT")" == "$BACKUP_ROOT" ]]
          else
            sudo install -d -m 700 -- "$BACKUP_ROOT"
          fi
          sudo chmod 700 -- "$BACKUP_ROOT" "$DATA_PATH"
          for sqlite_file in "$DATA_PATH/jiahuan.sqlite" "$DATA_PATH/jiahuan.sqlite-wal" "$DATA_PATH/jiahuan.sqlite-shm"; do
            if sudo test -e "$sqlite_file"; then
              sudo test -f "$sqlite_file"
              ! sudo test -L "$sqlite_file"
              sudo chmod 600 -- "$sqlite_file"
            fi
          done

          BACKUP_DIR=$(sudo mktemp -d "$BACKUP_ROOT/$(date -u +%Y%m%dT%H%M%SZ)-${REMOTE_TMP##*/}.XXXXXX")
          sudo chmod 700 -- "$BACKUP_DIR"
          sudo install -d -m 700 -- "$BACKUP_DIR/app"
          sudo rsync -a "$APP_PATH/" "$BACKUP_DIR/app/"
          sudo test -s "$BACKUP_DIR/app/package.json"

          app_replaced=0
          service_transition_started=0
          rollback() {
            local rc=${1:-1}
            trap - ERR HUP INT TERM
            set +e
            if (( service_transition_started )); then
              cd "$COMPOSE_PATH"
              sudo docker compose stop "$COMPOSE_SERVICE" >/dev/null 2>&1
            fi
            if (( app_replaced )) && [[ -n "${BACKUP_DIR:-}" ]]; then
              sudo rsync -a --delete "$BACKUP_DIR/app/" "$APP_PATH/"
            fi
            if (( service_transition_started )); then
              cd "$COMPOSE_PATH"
              sudo docker compose up -d --force-recreate --no-deps "$COMPOSE_SERVICE"
            fi
            [[ "$REMOTE_TMP" =~ ^/tmp/study-lecture-[0-9a-f]{40}$ ]] && sudo rm -rf -- "$REMOTE_TMP"
            echo "Deployment failed; previous app restore attempted. Database backup retained: ${BACKUP_DIR:-not-created}" >&2
            exit "$rc"
          }
          trap 'rollback $?' ERR
          trap 'rollback 129' HUP
          trap 'rollback 130' INT
          trap 'rollback 143' TERM

          sudo docker run --rm -i \
            -v "$REMOTE_TMP:/stage:ro" \
            -v "$DATA_PATH:/data" \
            -v "$BACKUP_DIR:/backup" \
            node:22-bookworm-slim node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          const require = createRequire("/stage/package.json");
          const Database = require("better-sqlite3");
          const source = new Database("/data/jiahuan.sqlite", { readonly: true, fileMustExist: true });
          try {
            source.pragma("busy_timeout = 10000");
            await source.backup("/backup/jiahuan.sqlite");
          } finally {
            source.close();
          }
          const copy = new Database("/backup/jiahuan.sqlite", { readonly: true, fileMustExist: true });
          try {
            const rows = copy.pragma("integrity_check");
            if (rows.length !== 1 || rows[0]?.integrity_check !== "ok") {
              throw new Error("SQLite backup integrity check failed");
            }
          } finally {
            copy.close();
          }
          NODE
          sudo test -s "$BACKUP_DIR/jiahuan.sqlite"
          sudo chmod 600 -- "$BACKUP_DIR/jiahuan.sqlite"

          service_transition_started=1
          cd "$COMPOSE_PATH"
          sudo docker compose stop "$COMPOSE_SERVICE"
          app_replaced=1
          sudo rsync -a --delete "$REMOTE_TMP/" "$APP_PATH/"
          sudo find "$APP_PATH" -type d -exec chmod 755 {} +
          sudo find "$APP_PATH" -type f -exec chmod 644 {} +
          sudo docker compose up -d --force-recreate --no-deps "$COMPOSE_SERVICE"

          healthy=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 "$LOCAL_HEALTH_URL" >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          (( healthy == 1 ))

          trap - ERR HUP INT TERM
          sudo rm -rf -- "$REMOTE_TMP"
          echo "Deployment healthy; rollback assets retained at $BACKUP_DIR"
          REMOTE

      - name: Public URL check
        run: |
          readonly PUBLIC_URL=https://lecture.gaid.studio
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 "$PUBLIC_URL/api/health" >/dev/null; then
              exit 0
            fi
            echo "Public URL check failed; retrying in 5 seconds ($attempt/24)."
            sleep 5
          done
          curl --fail --silent --show-error --max-time 10 "$PUBLIC_URL/api/health" >/dev/null
